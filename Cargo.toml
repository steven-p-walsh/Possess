[package]
name = "possess"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Repossess coding-agent sessions across harnesses"
repository = "https://github.com/steven-p-walsh/Possess"
readme = "README.md"
keywords = ["tui", "coding-agent", "session", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
ratatui = "0.29"
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
uuid = { version = "1.18", features = ["v7", "serde"] }
walkdir = "2.5"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.21"

[profile.release]
lto = "thin"
strip = true
